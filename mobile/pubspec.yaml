name: hrm_attendance_mobile
description: "Production-grade Employee Face & Location Attendance Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  geolocator: ^13.0.1
  google_fonts: ^6.2.1
  http: ^1.2.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
