<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HRM Attendance System</title>
    <meta name="description" content="Sistem Informasi Presensi & Manajemen SDM Mandiri">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <meta property="og:title" content="HRM Attendance System">
    <meta name="twitter:title" content="HRM Attendance System">
    <meta property="og:description" content="Sistem Informasi Presensi & Manajemen SDM Mandiri">
    <meta name="twitter:description" content="Sistem Informasi Presensi & Manajemen SDM Mandiri">
    <meta name="twitter:card" content="summary">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#062225">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PT FRP">
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest">
    <script>
      // EMERGENCY STORAGE SANITIZER: Langsung bersihkan hrm_attendance yang kembung dari browser/PWA
      (function() {
        try {
          var raw = localStorage.getItem('hrm_attendance');
          if (raw && (raw.indexOf('data:image/') !== -1 || raw.length > 50000)) {
            console.warn('[Storage Sanitizer] Auto-pruning bloated hrm_attendance...');
            var list = JSON.parse(raw);
            if (Array.isArray(list)) {
              var lean = list.slice(0, 10).map(function(item) {
                var c = Object.assign({}, item);
                delete c.photoIn;
                delete c.clockInPhoto;
                delete c.photoOut;
                delete c.clockOutPhoto;
                return c;
              });
              localStorage.setItem('hrm_attendance', JSON.stringify(lean));
            } else {
              localStorage.removeItem('hrm_attendance');
            }
          }
        } catch (e) {
          try { localStorage.removeItem('hrm_attendance'); } catch (_) {}
        }

        // FORCE CACHE PURGE & SERVICE WORKER UPDATE ON NEW BUILD
        var PURGE_TAG = 'hrm_deploy_v20261007_borderless_logo_v8';
        try {
          localStorage.removeItem('hrm_force_desktop_mode');
          if (localStorage.getItem('hrm_deploy_tag') !== PURGE_TAG) {
            localStorage.setItem('hrm_deploy_tag', PURGE_TAG);
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var j = 0; j < names.length; j++) {
                  caches.delete(names[j]);
                }
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var k = 0; k < regs.length; k++) {
                  regs[k].unregister();
                }
              });
            }
          } else if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].update();
              }
            });
          }
        } catch (_) {}
      })();

      // Capture PWA install prompt BEFORE any JS bundle loads
      window.__pwaInstallPrompt = null;
      window.__pwaInstallPromptListeners = new Set();
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        console.log('[PWA] beforeinstallprompt captured in HTML!');
        window.__pwaInstallPromptListeners.forEach(function(fn) { fn(); });
      });
      window.addEventListener('appinstalled', function() {
        window.__pwaInstallPrompt = null;
        console.log('[PWA] App installed!');
        window.__pwaInstallPromptListeners.forEach(function(fn) { fn(); });
      });
      // Global uncaught error display to prevent silent white screen
      window.addEventListener('error', function(e) {
        console.error('[HRM Global Error]', e.message, e.filename, e.lineno);
        var errBox = document.getElementById('hrm-critical-error');
        if (errBox) {
          errBox.style.display = 'block';
          errBox.textContent = 'Galat Inisialisasi: ' + (e.message || 'Unknown error') + ' (' + (e.filename || 'script') + ':' + (e.lineno || 0) + ')';
        }
      });
    </script>
    <style>
      html, body {
        background-color: #062225 !important;
        background: radial-gradient(circle at 50% 45%, #0b3438 0%, #062225 45%, #041416 100%) !important;
        margin: 0;
        padding: 0;
        color: #ffffff;
      }
    </style>
  </head>
  <body class="antialiased min-h-screen" style="background: radial-gradient(circle at 50% 45%, #0b3438 0%, #062225 45%, #041416 100%) !important; background-color: #062225 !important;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; background: radial-gradient(circle at 50% 45%, #0b3438 0%, #062225 45%, #041416 100%); color: #ffffff; padding: 20px; position: relative; overflow: hidden; user-select: none;">
        <!-- Grid Tech Pattern Persis Lampiran 4 -->
        <div style="position: absolute; inset: 0; pointer-events: none; opacity: 0.18; background-image: linear-gradient(to right, rgba(45, 212, 191, 0.2) 1px, transparent 1px), linear-gradient(to bottom, rgba(45, 212, 191, 0.2) 1px, transparent 1px); background-size: 40px 40px;"></div>

        <!-- Central Glowing Radar Rings -->
        <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 220px; height: 220px; margin-bottom: 28px;">
          <div style="position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(45, 212, 191, 0.3); animation: hrm-spin 10s linear infinite;"></div>
          <div style="position: absolute; inset: 8px; border-radius: 50%; border: 2px solid transparent; border-top-color: rgba(94, 234, 212, 0.9); border-right-color: rgba(94, 234, 212, 0.3); animation: hrm-spin 3.5s linear infinite;"></div>
          <div style="position: absolute; inset: 24px; border-radius: 50%; background: rgba(45, 212, 191, 0.12); filter: blur(14px); pointer-events: none;"></div>
          
          <!-- Logo Menyatu Tanpa Bingkai Kotak, Tetap Tajam & Jelas -->
          <div style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10;">
            <img src="/logo.png" alt="Logo" style="width: 102px; height: 102px; object-fit: contain; filter: drop-shadow(0 0 24px rgba(45, 212, 191, 0.7));" />
            <span style="font-size: 11px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; color: #5eead4; margin-top: 8px; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">2026</span>
          </div>
        </div>

        <!-- Branding PT FRP Berada Tepat di Tengah Simetris (Font Monospace Sama dengan Teks Bawah) -->
        <div style="text-align: center; margin-bottom: 28px; z-index: 10; width: 100%; max-width: 360px; padding: 0 16px;">
          <h1 style="font-size: 20px; font-weight: 900; letter-spacing: 1px; color: #ffffff; margin: 0 0 6px 0; text-align: center; text-shadow: 0 2px 12px rgba(0,0,0,0.8); line-height: 1.25; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace !important;">PT. FAWWAZ RESKI PERWIRA</h1>
          <p style="font-size: 11px; color: rgba(204, 251, 241, 0.85); margin: 0; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; text-align: center; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace !important;">Sistem Informasi Presensi & Manajemen SDM</p>
        </div>

        <!-- Progress Bar Loading -->
        <div style="width: 200px; height: 5px; border-radius: 10px; background: rgba(2, 6, 23, 0.8); border: 1px solid rgba(45, 212, 191, 0.3); overflow: hidden; padding: 1px; margin-bottom: 12px; z-index: 10;">
          <div style="height: 100%; border-radius: 10px; background: linear-gradient(to right, #2dd4bf, #5eead4, #67e8f9); box-shadow: 0 0 10px rgba(45, 212, 191, 0.8); animation: hrm-progress 2.2s ease-in-out infinite;"></div>
        </div>

        <!-- Status Text -->
        <p style="font-size: 12px; color: rgba(204, 251, 241, 0.85); font-family: monospace; letter-spacing: 0.5px; margin: 0; z-index: 10;">Synchronizing workspace</p>

        <div id="hrm-critical-error" style="display: none; margin-top: 16px; max-width: 480px; padding: 12px 16px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; color: #b91c1c; font-size: 12px; font-family: monospace; white-space: pre-wrap; word-break: break-word; z-index: 20;"></div>
        <style>
          @keyframes hrm-spin { to { transform: rotate(360deg); } }
          @keyframes hrm-progress {
            0% { width: 5%; }
            50% { width: 65%; }
            100% { width: 100%; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
